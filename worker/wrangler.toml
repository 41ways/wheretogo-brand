# 행선지4: Brand — 정답·점수·순위 서버 (Cloudflare Workers 무료 플랜 + D1)
#
# 정답은 이 서버만 안다. 브라우저는 고른 브랜드를 보내고 순위·점수·닮은 묶음 이름만 돌려받는다.
# 오늘 정답은 비밀값 ANSWER_SALT 로 섞은 순서에서 꺼내므로, 코드를 봐도 미리 알 수 없다.
#   npx wrangler secret put ANSWER_SALT     (한 번만. 바꾸면 그날부터 정답 순서가 통째로 바뀐다)
name = "wheretogo-brand"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[vars]
ALLOW_ORIGINS = "https://41ways.github.io"

[[d1_databases]]
binding = "DB"
database_name = "wheretogo-brand"
database_id = "f1ca2232-0eab-4834-aafa-21b3dcebe6d1"
